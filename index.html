<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğukan Sağlık | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --surface: #0f0f0f;
            --surface2: #161616;
            --border: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.18);
            --text: #f0ede8;
            --text-dim: rgba(240,237,232,0.65);
            --text-dimmer: rgba(240,237,232,0.45);
            --muted: #6b6b6b;
            --green: #7fff8f;
            --green-dim: rgba(127,255,143,0.08);
            --grid-line: rgba(255,255,255,0.015);
            --header-bg: rgba(8,8,8,0.88);
            --sep-line: rgba(255,255,255,0.03);
        }
        html[data-theme="light"] {
            --bg: #f5f3ef;
            --surface: #ffffff;
            --surface2: #eceae5;
            --border: rgba(0,0,0,0.09);
            --border-hover: rgba(0,0,0,0.2);
            --text: #111111;
            --text-dim: rgba(17,17,17,0.62);
            --text-dimmer: rgba(17,17,17,0.42);
            --muted: #999999;
            --green: #1a8c2b;
            --green-dim: rgba(26,140,43,0.07);
            --grid-line: rgba(0,0,0,0.04);
            --header-bg: rgba(245,243,239,0.92);
            --sep-line: rgba(0,0,0,0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 60% 40% at 80% 10%, rgba(127,255,143,0.03) 0%, transparent 60%),
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: auto, 40px 40px, 40px 40px;
            color: var(--text);
            font-family: 'DM Mono', monospace;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* HEADER */
        .site-header {
            position: sticky; top: 0; z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .header-inner {
            max-width: 900px; margin: 0 auto;
            padding: 0 24px; height: 56px;
            display: flex; align-items: center;
            justify-content: space-between; gap: 20px;
        }
        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 1rem; font-weight: 800;
            letter-spacing: 0.5px; white-space: nowrap;
            display: flex; align-items: center; gap: 8px;
        }
        .logo-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* TABS */
        .tabs {
            display: flex; gap: 2px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px; padding: 3px;
        }
        .tab-btn {
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem; color: var(--muted);
            background: transparent; border: none;
            padding: 5px 14px; border-radius: 5px;
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
            white-space: nowrap; letter-spacing: 0.3px;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active {
            background: var(--surface); color: var(--green);
            border: 1px solid rgba(127,255,143,0.15);
        }

        /* LANG */
        .lang-toggle {
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem; background: transparent;
            border: 1px solid var(--border); color: var(--muted);
            padding: 5px 10px; border-radius: 6px; cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
            white-space: nowrap; letter-spacing: 1px;
        }
        .lang-toggle:hover { color: var(--text); border-color: var(--border-hover); }

        /* THEME TOGGLE */
        .theme-toggle {
            font-family: 'DM Mono', monospace;
            font-size: 0.85rem; background: transparent;
            border: 1px solid var(--border); color: var(--muted);
            width: 34px; height: 34px; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
            flex-shrink: 0;
        }
        .theme-toggle:hover { color: var(--text); border-color: var(--border-hover); background: var(--surface2); }

        /* MAIN */
        .main { max-width: 900px; margin: 0 auto; padding: 56px 24px 80px; }

        /* PANELS */
        .panel { display: none; animation: fadeIn 0.25s ease; }
        .panel.active { display: block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

        /* HERO */
        .hero { margin-bottom: 56px; }
        .hero-name {
            font-family: 'Syne', sans-serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 800; line-height: 0.95;
            letter-spacing: -2px; text-transform: uppercase;
            margin-bottom: 20px; color: var(--text);
        }
        .hero-name span { display: block; color: var(--text); }
        .cursor {
            display: inline-block; width: 3px; height: 0.85em;
            background: var(--green); margin-left: 4px;
            vertical-align: baseline;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
        .hero-meta {
            display: flex; align-items: center; gap: 20px;
            margin-bottom: 32px; flex-wrap: wrap;
        }
        .hero-role { font-size: 0.85rem; color: var(--green); letter-spacing: 1px; }
        .hero-sep { color: var(--border-hover); }
        .hero-uni { font-size: 0.85rem; color: var(--muted); }
        .hero-bio {
            font-size: 1rem; line-height: 1.75;
            color: var(--text-dim);
            max-width: 600px; font-weight: 300;
        }
        .hero-links { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
        .hero-link {
            font-size: 0.78rem; color: var(--muted);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 7px 16px; border-radius: 6px;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
            letter-spacing: 0.5px;
        }
        .hero-link:hover { color: var(--text); border-color: var(--border-hover); background: var(--surface2); }
        .hero-link.primary {
            background: var(--green-dim); color: var(--green);
            border-color: rgba(127,255,143,0.2);
        }
        .hero-link.primary:hover { background: rgba(127,255,143,0.14); }

        /* SECTION HEAD */
        .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .section-head h2 {
            font-family: 'Syne', sans-serif;
            font-size: 0.7rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2.5px; color: var(--muted);
        }
        .section-line { flex: 1; height: 1px; background: var(--border); }

        /* PROJECT CARDS */
        .project-grid { display: grid; gap: 16px; }

            border: 1px solid var(--border);
            border-radius: 10px; padding:
