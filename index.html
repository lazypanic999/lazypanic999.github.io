<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğukan Sağlık | Portfolio</title>
    <link rel="icon" type="image/png" href="icons/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --surface: #0f0f0f;
            --surface2: #161616;
            --border: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.18);
            --text: #f0ede8;
            --text-dim: rgba(240,237,232,0.65);
            --text-dimmer: rgba(240,237,232,0.45);
            --muted: #6b6b6b;
            --green: #7fff8f;
            --green-dim: rgba(127,255,143,0.08);
            --grid-line: rgba(255,255,255,0.015);
            --header-bg: rgba(8,8,8,0.88);
            --sep-line: rgba(255,255,255,0.03);
        }
        html[data-theme="light"] {
            --bg: #f5f3ef;
            --surface: #ffffff;
            --surface2: #eceae5;
            --border: rgba(0,0,0,0.09);
            --border-hover: rgba(0,0,0,0.2);
            --text: #111111;
            --text-dim: rgba(17,17,17,0.62);
            --text-dimmer: rgba(17,17,17,0.42);
            --muted: #999999;
            --green: #1a8c2b;
            --green-dim: rgba(26,140,43,0.07);
            --grid-line: rgba(0,0,0,0.04);
            --header-bg: rgba(245,243,239,0.92);
            --sep-line: rgba(0,0,0,0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 60% 40% at 80% 10%, rgba(127,255,143,0.03) 0%, transparent 60%),
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: auto, 40px 40px, 40px 40px;
            color: var(--text);
            font-family: 'DM Mono', monospace;
            min-height: 100vh;
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        /* ── HEADER ── */
        .site-header {
            position: sticky; top: 0; z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            transition: background 0.35s ease, border-color 0.35s ease;
            animation: slideDown 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0);     opacity: 1; }
        }
        .header-inner {
            max-width: 900px; margin: 0 auto;
            padding: 0 24px; height: 56px;
            display: flex; align-items: center;
            justify-content: space-between; gap: 20px;
        }
        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 1rem; font-weight: 800;
            letter-spacing: 0.5px; white-space: nowrap;
            display: flex; align-items: center; gap: 8px;
        }
        .logo-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.7)} }

        /* ── TABS with sliding pill ── */
        .tabs {
            position: relative;
            display: flex; gap: 2px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px; padding: 3px;
        }
        .tab-indicator {
            position: absolute;
            top: 3px; height: calc(100% - 6px);
            background: var(--surface);
            border: 1px solid rgba(127,255,143,0.15);
            border-radius: 5px;
            transition: left 0.3s cubic-bezier(0.34,1.56,0.64,1), width 0.3s cubic-bezier(0.34,1.56,0.64,1);
            pointer-events: none;
        }
        .tab-btn {
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem; color: var(--muted);
            background: transparent; border: none;
            padding: 5px 14px; border-radius: 5px;
            cursor: pointer;
            transition: color 0.2s;
            white-space: nowrap; letter-spacing: 0.3px;
            position: relative; z-index: 1;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--green); }

        /* ── LANG / THEME ── */
        .lang-toggle, .theme-toggle {
            font-family: 'DM Mono', monospace;
            background: transparent;
            border: 1px solid var(--border); color: var(--muted);
            border-radius: 6px; cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.15s;
            flex-shrink: 0;
        }
        .lang-toggle { font-size: 0.72rem; padding: 5px 10px; letter-spacing: 1px; }
        .theme-toggle { font-size: 0.85rem; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
        .lang-toggle:hover, .theme-toggle:hover { color: var(--text); border-color: var(--border-hover); background: var(--surface2); transform: scale(1.05); }
        .theme-toggle:active { transform: scale(0.92) rotate(30deg); }

        /* ── MAIN ── */
        .main { max-width: 900px; margin: 0 auto; padding: 56px 24px 80px; }

        /* ── PANELS ── */
        .panel { display: none; }
        .panel.active { display: block; }

        /* ── SCROLL REVEAL ── */
        .reveal {
            opacity: 0;
            transform: translateY(22px);
            transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.22,1,0.36,1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal.delay-1 { transition-delay: 0.08s; }
        .reveal.delay-2 { transition-delay: 0.16s; }
        .reveal.delay-3 { transition-delay: 0.24s; }
        .reveal.delay-4 { transition-delay: 0.32s; }

        /* ── HERO ── */
        .hero { margin-bottom: 56px; }

        .hero-name {
            font-family: 'Syne', sans-serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 800; line-height: 0.95;
            letter-spacing: -2px; text-transform: uppercase;
            margin-bottom: 20px; color: var(--text);
            overflow: hidden;
        }
        .hero-name .line {
            display: block;
            animation: heroLine 0.75s cubic-bezier(0.16,1,0.3,1) both;
        }
        .hero-name .line:nth-child(2) { animation-delay: 0.1s; }
        @keyframes heroLine {
            from { transform: translateY(110%); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .cursor {
            display: inline-block; width: 3px; height: 0.85em;
            background: var(--green); margin-left: 4px;
            vertical-align: baseline;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        .hero-meta {
            display: flex; align-items: center; gap: 20px;
            margin-bottom: 32px; flex-wrap: wrap;
            animation: fadeUp 0.6s 0.35s cubic-bezier(0.22,1,0.36,1) both;
        }
        .hero-role { font-size: 0.85rem; color: var(--green); letter-spacing: 1px; }
        .hero-sep { color: var(--border-hover); }
        .hero-uni { font-size: 0.85rem
